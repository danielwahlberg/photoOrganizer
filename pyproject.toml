[project]
name = "photo-organizer"
version = "0.1.0"
description = "Local-first desktop app that proposes and applies reviewed photo rename/move actions."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
photo-organizer = "photo_organizer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
